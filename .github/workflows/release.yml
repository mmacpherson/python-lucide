# Release: push a v* tag on main whose version matches pyproject.toml.
#
#   git tag v0.5.11 && git push origin v0.5.11
#
# Runs the full CI on the tagged commit (which also builds the package), then
# publishes that build to PyPI via trusted publishing and creates the GitHub
# Release. PyPI's trusted publisher for this project must name this workflow
# (release.yml) and the `pypi` environment. After the release, the search
# database is rebuilt and attached to its own search-v* release.
name: release

on:
  push:
    tags: [v*]

permissions: {}

jobs:
  check-tag:
    name: Tag matches version, on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Check the tag
      run: |
        version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
        if [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "::error::tag $GITHUB_REF_NAME doesn't match pyproject.toml's version $version"
          exit 1
        fi
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::$GITHUB_REF_NAME isn't on main"
          exit 1
        fi

  ci:
    needs: check-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish to PyPI
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/python-lucide
    permissions:
      id-token: write  # trusted publishing, and attestations
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true
    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        gh release create "$GITHUB_REF_NAME" dist/*
        --repo "$GITHUB_REPOSITORY"
        --title "$GITHUB_REF_NAME"
        --generate-notes
        --verify-tag

  search-db:
    name: Search database release
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: '3.13'
        enable-cache: false  # a release job shouldn't restore caches PRs can write

    - name: Build and publish search database
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        uv sync --dev
        # The committed JSONL + clusters JSON are kept current by the weekly
        # update workflow; the release only derives the DB from them (no
        # Gemini calls, no theme drift from the committed clusters).
        make build-search

        SEARCH_DB=src/lucide/data/lucide-search.db
        if [ ! -f "$SEARCH_DB" ]; then
          echo "⚠️ Search database not built, skipping"
          exit 0
        fi

        LUCIDE_VERSION=$(sqlite3 "$SEARCH_DB" "SELECT value FROM metadata WHERE key='version';")
        RELEASE_TAG="search-v${LUCIDE_VERSION}"
        echo "Publishing search DB for Lucide v${LUCIDE_VERSION} → ${RELEASE_TAG}"

        # Create the search-data release if it doesn't already exist
        gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
          gh release create "$RELEASE_TAG" \
            --title "Search data for Lucide v${LUCIDE_VERSION}" \
            --notes "Pre-built semantic search database for Lucide icons v${LUCIDE_VERSION}. Downloaded automatically by \`python-lucide[search]\` on first use."

        gh release upload "$RELEASE_TAG" "$SEARCH_DB" --clobber
        echo "✅ Uploaded lucide-search.db to release ${RELEASE_TAG}"
