name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:  # from release.yml, on the tagged commit

permissions:
  contents: read

# Every uv command uses uv.lock as committed, and fails if it is stale
# (except the latest-deps job).
env:
  UV_LOCKED: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

    - name: Install dependencies
      run: uv sync --dev

    - name: Run pre-commit hooks
      run: make run-hooks-all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

    - name: Install dependencies
      run: uv sync --dev

    - name: Run tests
      run: make test

  # The jobs above test against uv.lock; this one tests what a new install
  # gets today, the newest versions pyproject.toml allows.
  latest-deps:
    name: Test (3.14, newest dependencies)
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: '3.14'

    - name: Install the newest deps
      run: uv sync --dev --upgrade

    - name: Run tests
      run: make test

  test-core-315:
    name: Core and packaging (3.15)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python 3.15
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.15'
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

    # Search and clustering dependencies do not yet provide all 3.15 wheels.
    - name: Install core test dependencies
      run: uv sync --no-dev --group test-core

    - name: Test core API and source-only package builds
      run: uv run --no-sync python -m pytest tests/core_test.py tests/db_source_test.py

  dist:
    name: Build the package; import the installed wheel
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        python-version: '3.13'
        enable-cache: false  # this build is what release.yml publishes

    - name: Build package
      run: uv build --no-sources

    - name: Check the metadata PyPI will render
      run: uvx twine check --strict dist/*

    - name: Import the installed wheel
      run: uv run --isolated --no-project --with dist/*.whl python -c "import lucide; print(lucide.lucide_icon('house')[:40])"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: dist-package
        path: dist/
        retention-days: 7
