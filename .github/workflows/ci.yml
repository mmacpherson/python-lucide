name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: uv sync --dev

    - name: Run pre-commit hooks
      run: make run-hooks-all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: uv sync --dev

    - name: Run tests
      run: make test

  test-core-315:
    name: Core and packaging (3.15)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.15
      uses: actions/setup-python@v7
      with:
        python-version: '3.15'
        allow-prereleases: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    # Search and clustering dependencies do not yet provide all 3.15 wheels.
    - name: Install core test dependencies
      run: uv sync --no-dev --group test-core

    - name: Test core API and source-only package builds
      run: uv run --no-sync python -m pytest tests/core_test.py tests/db_source_test.py
