repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-merge-conflict
  - id: detect-aws-credentials
    args: [--allow-missing-credentials]
  - id: detect-private-key
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: name-tests-test
    args: [--pytest]
  - id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.22
  hooks:
  - id: ruff
    args: [--fix, --exit-non-zero-on-fix]
        # args: [--fix, --show-fixes, --exit-non-zero-on-fix] # To debug unexpected failures.
  - id: ruff-format
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix, --indent, '2']
    # Pin the formatter: an unpinned one varies with when each machine's hook
    # environment was built (toml-sort 0.24 and 0.25 space inline tables
    # differently), so local hooks and CI disagreed. The weekly
    # update-pre-commit-hooks workflow bumps this pin.
    additional_dependencies: [toml-sort==0.25.0]
    # Lockfiles are machine-written; reformatting them only makes churn.
    exclude: ^uv\.lock$
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.3.0
  hooks:
  - id: mypy
    additional_dependencies: [mypy-extensions>=1.0.0, typing-extensions>=4.1.0, types-setuptools, pydantic>=2.0.0]
    exclude: ^tests/
